<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Demo Statis</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --g-900: #064e3b; --g-700: #047857; --g-500: #10b981; --g-100: #d1fae5; --g-50:  #ecfdf5;
        }

        body {
            font-family: 'Poppins', sans-serif; background-color: var(--g-900);
            height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0;
        }

        .login-card {
            background-color: #ffffff; border: 4px solid var(--g-500); border-radius: 0;
            width: 100%; max-width: 400px; padding: 2.5rem;
            box-shadow: 10px 10px 0px var(--g-700);
        }

        .form-control-flat {
            border-radius: 0; border: 2px solid var(--g-100); padding: 0.75rem 1rem; transition: all 0.2s ease;
        }
        
        .form-control-flat:focus { border-color: var(--g-700); box-shadow: none; outline: none; }

        .btn-mono {
            background-color: var(--g-700); color: #ffffff; border-radius: 0; border: 2px solid var(--g-900);
            font-weight: bold; text-transform: uppercase; letter-spacing: 2px; padding: 0.75rem; transition: all 0.2s ease-in-out;
        }
        
        .btn-mono:hover { background-color: var(--g-900); color: var(--g-100); }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="login-card">
            
            <div class="text-center mb-4">
                <img src="../assets/img/sidoarjo.png" alt="Logo Sidoarjo" width="80" class="mb-3">
                <h3 class="fw-bolder text-uppercase" style="color: var(--g-900); letter-spacing: 1px;">Admin Panel</h3>
                <p class="text-muted small">Mode Demo Portofolio (Statis)</p>
            </div>

            <form id="demoLoginForm">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase" style="color: var(--g-900);">Username</label>
                    <input type="text" class="form-control form-control-flat" placeholder="admin" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold small text-uppercase" style="color: var(--g-900);">Password</label>
                    <input type="password" class="form-control form-control-flat" placeholder="••••••••" required>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-mono">Masuk Sistem</button>
                </div>
            </form>

            <div class="text-center mt-4">
                <a href="../index.html" class="text-decoration-none small fw-semibold" style="color: var(--g-700); border-bottom: 1px dashed var(--g-700);">
                    &larr; Kembali ke Beranda
                </a>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('demoLoginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah form reload
            Swal.fire({
                title: 'Mode Statis!',
                text: 'Ini adalah versi demo statis untuk keperluan portofolio Vercel. Fitur dashboard admin dinonaktifkan karena tidak menggunakan database.',
                icon: 'info',
                confirmButtonColor: '#047857',
                confirmButtonText: 'Kembali ke Beranda'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '../index.html';
                }
            });
        });
    </script>
</body>
</html>
